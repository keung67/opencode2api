version: "1"
services:
- type: web
  name: opencode2api
  runtime: image
  image:
    url: ghcr.io/jasonxu114514/opencode2api:latest
  plan: free
  dockerCommand: sh -c cp -f /etc/secrets/config.json /var/lib/opencode2api/config.json
